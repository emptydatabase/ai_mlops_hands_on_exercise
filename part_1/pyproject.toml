[project]
name = "part-1"
version = "0.1.0"
description = "Part 1"
readme = "README.md"
authors = [
    { name = "Stefano Negri Merlo", email = "negrimerlostefano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "dash-bootstrap-components>=2.0.4",
    "gunicorn>=27.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
test = "test:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
